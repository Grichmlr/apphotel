name: Build Kitchen KOT APK

'on':
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  kitchen:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Extract Kitchen source
        run: |
          unzip -q kitchen-kot-voice-source.zip 'Kitchen/*' -d android-source
          test -f android-source/Kitchen/app/build.gradle
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Kitchen APK
        working-directory: android-source/Kitchen
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Upload Kitchen APK
        uses: actions/upload-artifact@v4
        with:
          name: RestaurantPOS-Kitchen-KOT-Voice
          path: android-source/Kitchen/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
