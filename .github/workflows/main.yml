name: Build TableFlow Waiter and Kitchen APKs

'on':
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [Waiter, Kitchen]
    steps:
      - uses: actions/checkout@v4
      - name: Extract latest TableFlow v2.4 source
        run: |
          unzip -q restaurantpos-android-source.zip -d android-source
          test -f android-source/TableFlow-Android-v2.4/${{ matrix.app }}/app/build.gradle
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build TableFlow APK
        working-directory: android-source/TableFlow-Android-v2.4/${{ matrix.app }}
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TableFlow-${{ matrix.app }}-v2.4
          path: android-source/TableFlow-Android-v2.4/${{ matrix.app }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
